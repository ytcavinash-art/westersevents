<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Westers CRM</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="admin-wrap">
    <p class="eyebrow">WESTERS CRM</p>
    <h1 style="font-size:48px">Event Enquiries</h1>

    <section id="loginCard" class="card" style="max-width:480px">
      <form id="loginForm">
        <label>Email<input name="email" type="email" required /></label>
        <label>Password<input name="password" type="password" required /></label>
        <button class="primary">Login</button>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <button id="refreshLeads" class="secondary">Refresh leads</button> <button id="logout" class="secondary">Logout</button><div id="metrics" class="admin-grid"></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Request</th><th>Client</th><th>Event</th><th>Date</th><th>Phone</th>
            <th>Budget</th><th>Status</th><th>Delivery</th><th>Created</th>
          </tr></thead>
          <tbody id="leadRows"></tbody>
        </table>
      </div>
    </section>
  </main>
<script src="/admin.js"></script>
</body>
</html>
