<svg xmlns="http://www.w3.org/2000/svg" width="180" height="150" viewBox="0 0 180 150">
  <defs><linearGradient id="brand" x2="1" y2="1"><stop stop-color="#ec08a5"/><stop offset=".5" stop-color="#7934db"/><stop offset="1" stop-color="#087cff"/></linearGradient></defs>
  <style>
    .letter { animation: letter 4s ease-in-out infinite; }
    .bubble { animation: float 4s ease-in-out infinite; }
    .dot { animation: pulse 1.5s ease-in-out infinite; }
    .second { animation-delay: .2s; } .third { animation-delay: .4s; }
    @keyframes letter { 0%,100% { transform: translateY(7px); } 45%,65% { transform: translateY(-5px); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes pulse { 0%,70%,100% { opacity: .4; } 35% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .letter,.bubble,.dot { animation: none; } }
  </style>
  <circle cx="86" cy="76" r="59" fill="#eeebfa"/>
  <ellipse cx="86" cy="136" rx="51" ry="5" fill="#e5e4f0"/>
