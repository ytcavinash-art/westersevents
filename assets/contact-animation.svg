    <path d="M62 64h32M62 75h49M62 86h37" fill="none" stroke="#b6a2e6" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="m33 73 54 32 54-32v48a8 8 0 0 1-8 8H41a8 8 0 0 1-8-8Z" fill="url(#brand)"/>
  <path d="m35 124 37-28m67 28-37-28" fill="none" stroke="white" stroke-opacity=".3" stroke-width="2"/>
