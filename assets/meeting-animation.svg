<svg xmlns="http://www.w3.org/2000/svg" width="180" height="140" viewBox="0 0 180 140" role="img" aria-labelledby="title">
  <title id="title">Meeting calendar with an animated confirmation check</title>
  <defs>
    <linearGradient id="brand" x2="1" y2="1"><stop stop-color="#eb08a4"/><stop offset=".55" stop-color="#7030dc"/><stop offset="1" stop-color="#087bff"/></linearGradient>
  </defs>
  <style>
    .calendar { animation: float 4s ease-in-out infinite; }
    .check { stroke-dasharray: 35; animation: confirm 4s ease-in-out infinite; }
    .date { animation: date 4s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes confirm { 0%,15% { stroke-dashoffset: 35; opacity: 0; } 35%,80% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes date { 0%,100% { opacity: .35; } 35%,80% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .calendar,.check,.date { animation: none; } }
  </style>
  <ellipse cx="87" cy="126" rx="51" ry="5" fill="#eff0f9"/>
  <circle cx="88" cy="68" r="59" fill="#f7f5ff"/>
  <g class="calendar">
    <rect x="35" y="24" width="106" height="91" rx="13" fill="white" stroke="#ddd9f1" stroke-width="2"/>
    <path d="M48 24h80a13 13 0 0 1 13 13v13H35V37a13 13 0 0 1 13-13" fill="url(#brand)"/>
    <path d="M58 18v15m60-15v15" stroke="#142541" stroke-width="5" stroke-linecap="round"/>
    <g fill="#dddff0">
      <rect x="50" y="62" width="13" height="10" rx="3"/><rect x="73" y="62" width="13" height="10" rx="3"/><rect x="96" y="62" width="13" height="10" rx="3"/>
      <rect x="50" y="83" width="13" height="10" rx="3"/><rect x="96" y="83" width="13" height="10" rx="3"/>
    </g>
    <rect class="date" x="71" y="80" width="18" height="17" rx="5" fill="url(#brand)"/>
    <circle cx="137" cy="100" r="23" fill="url(#brand)" stroke="white" stroke-width="4"/>
    <path class="check" d="m126 100 7 7 14-15" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
